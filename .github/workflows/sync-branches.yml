name: Sync Branches

on:
  push:
    branches:
      - main
      - bigtree

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Sync main → bigtree
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin bigtree >/dev/null 2>&1; then
            if git show-ref --verify --quiet refs/heads/bigtree; then
              git checkout bigtree
            else
              git checkout -b bigtree origin/bigtree
            fi
          else
            git checkout -b bigtree origin/main
            git push origin bigtree
          fi
          git merge origin/main --allow-unrelated-histories -m "Auto-sync: main → bigtree" || (code=$?; echo "Merge failed with exit code ${code}; continuing sync workflow.")
          git push origin bigtree || (code=$?; echo "Push failed with exit code ${code}; continuing sync workflow.")
      
      - name: Sync bigtree → main
        if: github.ref == 'refs/heads/bigtree'
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/heads/main; then
            git checkout main
          else
            git checkout -b main origin/main
          fi
          git merge origin/bigtree --allow-unrelated-histories -m "Auto-sync: bigtree → main" || (code=$?; echo "Merge failed with exit code ${code}; continuing sync workflow.")
          git push origin main || (code=$?; echo "Push failed with exit code ${code}; continuing sync workflow.")
